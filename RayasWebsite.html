<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- so I Can use Rockets !-->
  <title>Raya's website</title>

  <!-- CSS Section Starts Here-->
  <style>
    body {
      font-family: 'Brush Script MT', cursive;
      padding: 30px;
      background-color: #93e4b3;
    }

    input {
      padding: 8px;
      margin: 5px;
    }
 
    button {
      padding: 10px 15px;
      margin-top: 10px;
      background-color: #4f46e5;
      color: white;
      border: none;
      cursor: cell;
      border-radius: 5px;
    }

    table {
      width: 80%;
      margin-top: 30px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;

    }

    thead {
      background-color: #4f46e5;
      color: white;
      font-family: Arial, Helvetica, sans-serif;

    }

    tbody tr:nth-child(even) {
      background-color: #eee;
    }/* idk what is this */

  </style>
</head>
<body>

  <h2>This Table is for Data Employees </h2>
  <p>Please enter your info </p>
  <form method="POST" action="/Add">
  <input type="text" id="Fname" placeholder="First Name" />
  <input type="text" id="Lname" placeholder="Last Name" />
  <input type="number" id="id" placeholder="ID" />
  <input type="text" id="rank" placeholder="Rank" />
  <input type="text" id="spec" placeholder="Speciality" />

  <button onclick="addRow()">Add</button>
  </form>
  <table id="teachers">
    <thead>
      <tr>
        <th>FirstName</th>
        <th>Last Name</th>
        <th>ID</th>
        <th>Rank</th>
        <th>Speciality</th>
      </tr>
    </thead>
    <tbody>
      <!-- New rows will be added here -->
    </tbody>
  </table>

  <script>

    function addRow() {
      
      
      const xhttp = new XMLHttpRequest();
      // Get user input 
      event.preventDefault();
      const Fname = document.getElementById("Fname").value;
      const Lname = document.getElementById("Lname").value;
      const id = document.getElementById("id").value;
      const rank = document.getElementById("rank").value;
      const spec=document.getElementById("spec").value;
      // encoding and collecting data
      const data = `Fname=${encodeURIComponent(Fname)}&Lname=${encodeURIComponent(Lname)}&id=${encodeURIComponent(id)}&rank=${encodeURIComponent(rank)}&spec=${encodeURIComponent(spec)}`;

      
      // AJAX Request 
      xhttp.open("POST", "http://94.127.213.228:5000/Add",false);
      xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
      
     
      //after running flask -testing request result
      xhttp.onreadystatechange = function () {
        if (this.readyState === 4) {
          if (this.status === 200) {
            alert(" Data inserted successfully!");
           // document.getElemtById("teachers").reset(); // reset 
          } else {
            alert(" Error occurred: " + this.responseText);// pop-up window
          }
        }
      };

      xhttp.send(data);// then this request is recieved by flask

      // Simple validation
      if (!Fname || !Lname || !id || !rank || !spec) {
        alert("Please fill in all fields!");
        return;
      }
     
      
      // inserting data into website table
      const table = document.getElementById('teachers').getElementsByTagName('tbody')[0];
      const newRow = table.insertRow(); 
      const FirstName = newRow.insertCell(0);
      const LastName = newRow.insertCell(1);
      const ID = newRow.insertCell(2);
      const Rank =newRow.insertCell(3);
      const Speciality =newRow.insertCell(4);

    

      FirstName.textContent = Fname;
      LastName.textContent = Lname;
      ID.textContent = id;
      Rank.textContent=rank;
      Speciality.textContent=spec;
      
      }
  </script>
</body>
</html>
